<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description"><title id="title">Offscript — brand guideline concept</title><desc id="description">Oversized typography, electric contrast and a personality that refuses to blend in.</desc><rect width="800" height="600" fill="#D4FF3F"/><text x="38" y="50" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1c2520" font-weight="700" letter-spacing="1">INDEPENDENT BY DESIGN.</text><text x="760" y="50" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1c2520" font-weight="400" text-anchor="end">V.01</text><text x="24" y="245" font-family="Arial, Helvetica, sans-serif" font-size="240" fill="#1c2520" font-weight="900" letter-spacing="-18">off</text><text x="24" y="429" font-family="Arial, Helvetica, sans-serif" font-size="207" fill="#1c2520" font-weight="900" letter-spacing="-16">script.</text><path d="M596 118L724 246M724 118L596 246" stroke="#171915" stroke-width="29"/><path d="M38 481H762" stroke="#171915" stroke-width="2"/><text x="38" y="523" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1c2520" font-weight="700" >A DIFFERENT KIND</text><text x="38" y="548" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1c2520" font-weight="700" >OF BRAND BOOK.</text><text x="762" y="548" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1c2520" font-weight="400" text-anchor="end">01 — THE IDENTITY</text></svg>