<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description"><title id="title">Kanso — brand guideline concept</title><desc id="description">A restrained, warm identity system that gives every element room to breathe.</desc><rect width="800" height="600" fill="#E8E4DB"/><text x="44" y="50" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#403F38" font-weight="400" letter-spacing="4">KANSO</text><text x="756" y="50" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#403F38" font-weight="400" text-anchor="end" letter-spacing="1.5">THE ESSENTIALS</text><circle cx="400" cy="253" r="105" stroke="#403F38" stroke-width="2" fill="none"/><path d="M400 148V358M295 253H505" stroke="#403F38" stroke-width="2"/><circle cx="400" cy="253" r="30" fill="#A4AB96"/><text x="400" y="447" font-family="Georgia, serif" font-size="58" fill="#403F38" font-weight="400" text-anchor="middle" letter-spacing="-2">Less, with purpose.</text><path d="M44 505H756" stroke="#403F38" stroke-width="1"/><text x="44" y="546" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#403F38" font-weight="400" letter-spacing="2">VISUAL IDENTITY</text><text x="756" y="546" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#403F38" font-weight="400" text-anchor="end">01</text></svg>