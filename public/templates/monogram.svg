<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description"><title id="title">Monogram — brand guideline concept</title><desc id="description">A refined editorial identity with timeless serif typography and elegant proportions.</desc><rect width="800" height="600" fill="#3C2529"/><text x="42" y="50" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#EEE0CF" font-weight="400" letter-spacing="4">MONOGRAM</text><text x="758" y="50" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#EEE0CF" font-weight="400" text-anchor="end" letter-spacing="1.5">IDENTITY GUIDELINES</text><rect x="287" y="108" width="226" height="253" fill="none" stroke="#B9957D"/><text x="400" y="311" font-family="Georgia, serif" font-size="213" fill="#EEE0CF" font-weight="400" text-anchor="middle">M</text><text x="400" y="446" font-family="Georgia, serif" font-size="52" fill="#EEE0CF" font-weight="400" text-anchor="middle" letter-spacing="-1.5">An enduring impression.</text><path d="M42 502H758" stroke="#B9957D" stroke-width="1"/><text x="42" y="545" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#EEE0CF" font-weight="400" letter-spacing="1.3">CRAFTED TO BE REMEMBERED.</text><text x="758" y="545" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#EEE0CF" font-weight="400" text-anchor="end" letter-spacing="1.3">VOLUME I</text></svg>